[tool.poetry]
name = "engram-backend"
version = "0.1.0"
description = "Engram AI Memory Infrastructure Platform"
authors = ["Engram Team"]
python = "^3.12"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.30"}
alembic = "^1.13.1"
pydantic = "^2.7.1"
pydantic-settings = "^2.3.0"
asyncpg = "^0.29.0"
redis = {extras = ["hiredis"], version = "^5.0.4"}
pgvector = "^0.3.0"
anthropic = "^0.28.0"
openai = "^1.35.0"
sentence-transformers = "^3.0.0"
httpx = "^0.27.0"
python-socketio = "^5.11.2"
structlog = "^24.2.0"
tenacity = "^8.3.0"
python-ulid = "^2.2.0"
tiktoken = "^0.7.0"
numpy = "^1.26.0"
python-multipart = "^0.0.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.7"
pytest-cov = "^5.0.0"
httpx = "^0.27.0"
factory-boy = "^3.3.0"
ruff = "^0.4.9"
mypy = "^1.10.0"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
