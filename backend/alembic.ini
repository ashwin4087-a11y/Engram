# Alembic configuration
[alembic]
script_location = migrations
sqlalchemy.url = postgresql+asyncpg://postgres.kclmylhpmggwapajflis:AshAfz0910%%40%%23%%24@aws-0-ap-northeast-1.pooler.supabase.com:6543/postgres?ssl=require

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
